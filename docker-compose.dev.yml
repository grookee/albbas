name: albbas-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: albbas-postgres
    environment:
      POSTGRES_USER: albbas
      POSTGRES_PASSWORD: albbas
      POSTGRES_DB: albbas
    ports:
      - "5433:5432"
    volumes:
      - albbas-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albbas -d albbas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: albbas-redis
    ports:
      - "6379:6379"

volumes:
  albbas-pg-data:
    name: albbas_albbas-pg-data
